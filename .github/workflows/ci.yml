name: CI

on:
  pull_request:
  push:
    branches: [main]

# One PR at a time - cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # No em dash anywhere in the repo (SS-330): cheap, so it runs before the install.
      - run: npm run check:dashes
      - run: npm run check:banner
      # The board's one-at-a-time rule (scripts/board.mjs, #138): plain Node, no install needed.
      - run: npm run test:scripts

      - run: npm ci

      # Turbo resolves the order (build the packages before typecheck / build apps).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # What would actually ship to npm. Runs on every PR so a stray file in the
  # tarball is caught before a release. `--dry-run` needs no auth.
  publish-dry-run:
    name: npm publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@sereno-ds/ui
      - name: "@sereno-ds/tokens: tarball contents"
        run: npm publish --dry-run --workspace=@sereno-ds/tokens
      - name: "@sereno-ds/ui: tarball contents"
        run: npm publish --dry-run --workspace=@sereno-ds/ui

  # Pixel-by-pixel regression tests (SS-579): the docs build is screenshotted (every example of every
  # component, light / dark / 375 px, plus hover, focus and what opens) and compared with the references in
  # apps/docs/e2e/__screenshots__ with zero tolerance. See docs/testing.md.
  #
  # The same `npx playwright test` also runs the `forced` project (Windows High Contrast, #135) and the `axe-light` /
  # `axe-dark` projects (accessibility on every docs page, with a baseline of known violations, #142): none of the
  # three keeps reference images, and a failure of any of them fails this job.
  #
  # Same image as `scripts/visual.sh`, and the same CPU architecture (arm64, like the Docker of an Apple
  # Silicon Mac): the same pixels need the same fonts, the same Chromium and the same CPU.
  # Keep the image tag in step with `@playwright/test` in apps/docs/package.json.
  visual:
    name: visual regression (pixel by pixel)
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The image ships a newer Node and npm than the repo uses (the lockfile is npm 10's): install Node 20, like
      # every other job, so `npm ci` and the docs build are the same as everywhere else. Playwright and its
      # Chromium come from the image either way.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:docs
      - name: Compare with the references
        working-directory: apps/docs
        env:
          CI: "1"
        run: npx playwright test
      # What changed, as images: expected / actual / diff for every failing picture, plus the HTML report.
      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: |
            apps/docs/test-results
            apps/docs/e2e-report
          retention-days: 14

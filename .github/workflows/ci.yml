name: CI

on:
  pull_request:
  push:
    branches: [main]

# One PR at a time — cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Turbo resolves the order (build the packages before typecheck / build apps).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

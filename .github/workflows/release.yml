name: Release

# Publishes @sereno-ds/ui + @sereno-ds/tokens to npm. This is NOT the
# showcase/demo deploy (that's Railway, on its own) — see CLAUDE.md § "Package
# release".
#
# Flow (Changesets):
#   1. PRs land on main carrying `.changeset/*.md` files.
#   2. This workflow opens/updates a "chore: version packages" PR that runs
#      `changeset version` (bumps package.json + CHANGELOG, deletes changesets).
#   3. Merging that PR runs `changeset publish` → `npm publish` for each package
#      whose version isn't on the registry yet, and pushes the
#      `@sereno-ds/*@x.y.z` git tags.
#
# Auth: OIDC trusted publishing — NO NPM_TOKEN. The install runs on Node 20 (to
# match `ci.yml`'s lockfile); npm is then bumped to 11.x (≥ 11.5.1, the floor
# for OIDC trusted publishing) for the publish step. `id-token: write` +
# `provenance: true` in each package's publishConfig + a Trusted Publisher
# configured on npm for this repo + this workflow.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version-bump commit + tags
  pull-requests: write # the "chore: version packages" PR
  id-token: write # OIDC: provenance + trusted publishing

jobs:
  release:
    name: version PR / publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Gate: the packages must build + lint + test before anything can publish.
      - run: npx turbo run lint typecheck test build --filter=@sereno-ds/ui --filter=@sereno-ds/tokens

      # OIDC trusted publishing needs npm ≥ 11.5.1; Node 20 ships npm 10. Pinned
      # to 11.x on purpose — npm@latest is 12.x now, which requires Node 22+.
      - run: npm install -g npm@11

      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no NPM_TOKEN — publish auth is OIDC trusted publishing

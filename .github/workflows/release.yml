name: Release

# Publishes @sereno-ds/ui + @sereno-ds/tokens to npm. NOT the showcase/demo
# deploy (Railway, separate) — see CLAUDE.md § "Package release".
#
# Direct-publish flow (no intermediate "Version Packages" PR):
#   1. A feature PR lands on main carrying a `.changeset/*.md` file.
#   2. On that push this workflow runs `changeset version` (bumps
#      package.json + CHANGELOG, deletes the consumed changesets), commits the
#      bump straight to main, then `changeset publish` → `npm publish` for each
#      package whose version isn't on the registry yet + pushes the
#      `@sereno-ds/*@x.y.z` git tags changesets creates natively.
#   3. It then also tags that same commit `vX.Y.Z` (the two packages are
#      version-locked via `fixed` in .changeset/config.json, so one tag covers
#      both) and creates the GitHub Release from it — title is just `vX.Y.Z`;
#      body is built by `.github/scripts/build-release-notes.mjs` from
#      `apps/docs/src/design-system/CHANGELOG.md`'s narrative section for that
#      version (falls back to the machine `packages/*/CHANGELOG.md`s if that
#      entry is missing). Keeps every release's title in the same `vX.Y.Z`
#      format, no manual step.
#   4. A push with no pending changesets is a no-op (the config-only PRs, the
#      bump commit itself).
#
# The bump commit is pushed with GITHUB_TOKEN, which by design does not trigger
# another workflow run, so there's no loop. `changeset status` + the
# `publish-dry-run` job in ci.yml run on every feature PR — that's the
# review point for the version now, in place of a dedicated PR.
#
# Auth: OIDC trusted publishing — NO NPM_TOKEN. Install on Node 20 (matches
# ci.yml's lockfile); npm bumped to 11.x (≥ 11.5.1, the OIDC floor) for the
# publish step. Needs `id-token: write` + `provenance: true` in each package's
# publishConfig + a Trusted Publisher configured on npm for this repo + workflow.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version-bump commit + tags
  id-token: write # OIDC: provenance + trusted publishing

jobs:
  release:
    name: version + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Gate: the packages must build + lint + test before anything can publish.
      - run: npx turbo run lint typecheck test build --filter=@sereno-ds/ui --filter=@sereno-ds/tokens

      # OIDC trusted publishing needs npm ≥ 11.5.1; Node 20 ships npm 10. Pinned
      # to 11.x on purpose — npm@latest is 12.x now, which requires Node 22+.
      - run: npm install -g npm@11

      - name: Version, commit, publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          npx changeset version
          git add -A
          if git diff --staged --quiet; then
            echo "No pending changesets — nothing to release."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release [skip ci]"
          git push origin HEAD:main

          # publish first fails safe: main already carries the bump, so a re-run
          # (which finds no changesets) retries just the publish.
          npx changeset publish
          git push origin --tags

          VERSION="$(node -p "require('./packages/ui/package.json').version")"
          TAG="v${VERSION}"

          # Re-runs after a partial failure land here again — both checks are
          # against the remote, so they still no-op correctly.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            node .github/scripts/build-release-notes.mjs "$VERSION" /tmp/release-notes.md
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          fi
